name = "holi-push"
main = "src/index.js"
compatibility_date = "2026-08-01"
# @pushforge/builder uses node:crypto internally for VAPID signing.
compatibility_flags = ["nodejs_compat"]

# Runs every minute so scheduled reminders fire on the right HH:MM.
# Cloudflare's free tier easily covers 1440 invocations/day.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "HOLI_PUSH"
id = "60285bd2d2ca4e75ad9c7f259a5ac4a0"
